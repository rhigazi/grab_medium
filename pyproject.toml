[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grab_medium"
version = "0.1.0"
description = "High-performance media directory scanner and DuckDB ingester"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "duckdb>=0.9.0",
    "click>=8.0.0",
    "rich>=12.0.0",
    "pandas>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
grab-medium = "grab_medium.cli:cli"
investigate-media = "grab_medium.investigate_cli:cli"

[tool.setuptools.packages.find]
where = ["."]
